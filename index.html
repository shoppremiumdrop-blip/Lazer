<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Salon Hidayet | Lazer & Müşteri Takip Sistemi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            cream: '#FAF7F5',
            blush: '#F4EAE6',
            rosegold: '#C58B7D',
            rosegoldDark: '#A86D5F',
            charcoal: '#231F20',
            taupe: '#7A6E6B'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FAF7F5;
      color: #231F20;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(197, 139, 125, 0.22);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="font-sans antialiased min-h-screen pb-24">

  <!-- Üst Başlık (Header) -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-rosegold/20 px-4 py-3.5 shadow-sm">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <div>
        <span class="text-[10px] tracking-[0.22em] uppercase text-rosegold font-bold block">Hair & Makeup Studio</span>
        <h1 class="font-serif text-2xl sm:text-3xl font-bold tracking-tight text-charcoal leading-none">
          Salon Hidayet <span class="text-rosegold font-normal italic text-xl sm:text-2xl">Lazer Paneli</span>
        </h1>
      </div>

      <div class="flex items-center gap-2">
        <div id="dbStatusBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200">
          <span id="dbStatusDot" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
          <span id="dbStatusText">Bağlanıyor...</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-5 space-y-6">

    <!-- Özet İstatistik Kartları -->
    <section class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="glass-card rounded-2xl p-4 shadow-sm">
        <p class="text-xs text-taupe font-medium">Bugünkü Randevu</p>
        <p id="statTodayCount" class="text-2xl font-bold text-charcoal mt-1">0</p>
      </div>
      <div class="glass-card rounded-2xl p-4 shadow-sm">
        <p class="text-xs text-taupe font-medium">Toplam Müşteri</p>
        <p id="statCustomerCount" class="text-2xl font-bold text-charcoal mt-1">0</p>
      </div>
      <div class="glass-card rounded-2xl p-4 shadow-sm">
        <p class="text-xs text-taupe font-medium">Tahsil Edilen</p>
        <p id="statTotalPaid" class="text-2xl font-bold text-emerald-700 mt-1">₺0</p>
      </div>
      <div class="glass-card rounded-2xl p-4 shadow-sm">
        <p class="text-xs text-taupe font-medium">Kalan Bakiye</p>
        <p id="statTotalRemaining" class="text-2xl font-bold text-rosegoldDark mt-1">₺0</p>
      </div>
    </section>

    <!-- Hızlı Aksiyon Butonları -->
    <section class="grid grid-cols-2 gap-3">
      <button onclick="openModal('appointmentModal')" class="flex items-center justify-center gap-2 bg-charcoal hover:bg-neutral-800 active:scale-[0.99] text-white font-semibold py-3.5 px-4 rounded-2xl shadow-md transition">
        <svg class="w-5 h-5 text-rosegold" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <span>Yeni Randevu</span>
      </button>
      <button onclick="openModal('customerModal')" class="flex items-center justify-center gap-2 bg-rosegold hover:bg-rosegoldDark active:scale-[0.99] text-white font-semibold py-3.5 px-4 rounded-2xl shadow-md transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
        <span>Yeni Müşteri Kaydı</span>
      </button>
    </section>

    <!-- Sekme Geçişleri -->
    <div class="flex bg-blush/80 p-1 rounded-2xl border border-rosegold/20">
      <button id="tabAppointmentsBtn" onclick="switchTab('appointments')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl bg-white text-charcoal shadow-sm transition">
        Randevu Takvimi
      </button>
      <button id="tabCustomersBtn" onclick="switchTab('customers')" class="flex-1 py-2.5 text-sm font-semibold rounded-xl text-taupe hover:text-charcoal transition">
        Müşteriler & Paketler
      </button>
    </div>

    <!-- RANDEVULAR SEKMESİ -->
    <section id="appointmentsSection" class="space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-3.5 rounded-2xl border border-rosegold/20 shadow-sm">
        <div class="flex items-center gap-2">
          <label for="filterDate" class="text-xs font-semibold uppercase tracking-wider text-taupe">Tarih:</label>
          <input type="date" id="filterDate" class="bg-cream border border-rosegold/30 rounded-xl px-3 py-1.5 text-sm font-medium text-charcoal focus:outline-none focus:border-rosegold">
        </div>
        <div class="flex items-center gap-2">
          <button onclick="setTodayFilter()" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-blush text-rosegoldDark hover:bg-rosegold/20 transition">Bugün</button>
          <button onclick="clearDateFilter()" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-cream text-taupe hover:text-charcoal border border-neutral-200 transition">Tüm Tarihler</button>
        </div>
      </div>

      <div id="appointmentsList" class="space-y-3">
        <!-- Randevu kartları buraya dinamik gelecek -->
      </div>
    </section>

    <!-- MÜŞTERİLER SEKMESİ -->
    <section id="customersSection" class="hidden space-y-4">
      <div class="relative">
        <input type="text" id="customerSearchInput" oninput="renderCustomers()" placeholder="Müşteri adı, telefon veya bölge ara..." class="w-full bg-white border border-rosegold/25 rounded-2xl pl-10 pr-4 py-3 text-sm text-charcoal placeholder-taupe/70 shadow-sm focus:outline-none focus:border-rosegold">
        <svg class="w-4 h-4 text-taupe absolute left-3.5 top-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.5 4.5a7.5 7.5 0 0012.15 12.15z"/></svg>
      </div>

      <div id="customersList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Müşteri kartları buraya dinamik gelecek -->
      </div>
    </section>

  </main>

  <!-- MODAL 1: YENİ MÜŞTERİ KAYDI -->
  <div id="customerModal" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-neutral-100 pb-3 mb-4">
        <h2 class="font-serif text-2xl font-bold text-charcoal">Yeni Lazer Müşteri Kaydı</h2>
        <button onclick="closeModal('customerModal')" class="p-1.5 rounded-full bg-cream text-taupe hover:text-charcoal">✕</button>
      </div>

      <form id="customerForm" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-taupe mb-1">Ad Soyad *</label>
          <input type="text" id="custName" required placeholder="Örn: Ayşe Yılmaz" class="w-full bg-cream border border-rosegold/30 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-rosegold">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-taupe mb-1">Telefon *</label>
            <input type="tel" id="custPhone" required placeholder="05XX XXX XX XX" class="w-full bg-cream border border-rosegold/30 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-rosegold">
          </div>
          <div>
            <label class="block text-xs font-semibold text-taupe mb-1">Cilt / Kıl Tipi</label>
            <select id="custSkinType" class="w-full bg-cream border border-rosegold/30 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-rosegold">
              <option value="Tip II - Açık Ten">Tip II - Açık Ten</option>
              <option value="Tip III - Buğday Ten" selected>Tip III - Buğday Ten</option>
              <option value="Tip IV - Esmer Ten">Tip IV - Esmer Ten</option>
              <option value="Hassas Cilt">Hassas Cilt</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-taupe mb-1">Paket / Uygulama Bölgesi *</label>
          <input type="text" id="custPackage" required placeholder="Örn: Tüm Vücut (8 Seans) veya Koltuk Altı + Bacak" class="w-full bg-cream border border-rosegold/30 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-rosegold">
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-taupe mb-1">Toplam Seans</label>
            <input type="number" id="custTotalSessions" value="8" min="1" max="30" required class="w-full bg-cream border border-rosegold/30 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-rosegold">
          </div>
          <div>
            <label class="block text-xs font-semibold text-taupe mb-1">Paket Ücreti (₺)</label>
            <input type="number" id="custTotalPrice" value="0" min="0" required class="w-full bg-cream border border-rosegold/30 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-rosegold">
          </div>
          <div>
            <label class="block text-xs font-semibold text-taupe mb-1">Peşinat (₺)</label>
            <input type="number" id="custPaidAmount" value="0" min="0" required class="w-full bg-cream border border-rosegold/30 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-rosegold">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-taupe mb-1">Cihaz / Joule / Hassasiyet Notu</label>
          <textarea id="custNotes" rows="2" placeholder="Örn: Buz başlıklı lazer, 18 Joule başlangıç, alerji yok..." class="w-full bg-cream border border-rosegold/30 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:border-rosegold"></textarea>
        </div>

        <button type="submit" class="w-full bg-rosegold hover:bg-rosegoldDark text-white font-semibold py-3 rounded-xl shadow-md transition">
          Müşteriyi Kaydet
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL 2: YENİ RANDEVU OLUŞTUR -->
  <div id="appointmentModal" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-neutral-100 pb-3 mb-4">
        <h2 class="font-serif text-2xl font-bold text-charcoal">Yeni Lazer Randevusu</h2>
        <button onclick="closeModal('appointmentModal')" class="p-1.5 rounded-full bg-cream text-taupe hover:text-charcoal">✕</button>
      </div>

      <form id="appointmentForm" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-taupe mb-1">Müşteri Seçin *</label>
          <select id="apptCustomerSelect" required onchange="autoFillAreaFromCustomer()" class="w-full bg-cream border border-rosegold/30 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-rosegold">
            <option value="">-- Kayıtlı Müşteri Seçin --</option>
          </select>
          <p class="text-[11px] text-taupe mt-1">Listede yoksa önce "Yeni Müşteri Kaydı" oluşturun.</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-taupe mb-1">Randevu Tarihi *</label>
            <input type="date" id="apptDate" required class="w-full bg-cream border border-rosegold/30 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-rosegold">
          </div>
          <div>
            <label class="block text-xs font-semibold text-taupe mb-1">Saat *</label>
            <input type="time" id="apptTime" required value="14:00" class="w-full bg-cream border border-rosegold/30 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-rosegold">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-taupe mb-1">İşlem Bölgesi *</label>
          <input type="text" id="apptArea" required placeholder="Örn: Tüm Vücut - 3. Seans" class="w-full bg-cream border border-rosegold/30 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-rosegold">
        </div>

        <div>
          <label class="block text-xs font-semibold text-taupe mb-1">Randevu Notu</label>
          <input type="text" id="apptNote" placeholder="Örn: Jilet kontrolü hatırlatıldı" class="w-full bg-cream border border-rosegold/30 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-rosegold">
        </div>

        <button type="submit" class="w-full bg-charcoal hover:bg-neutral-800 text-white font-semibold py-3 rounded-xl shadow-md transition">
          Randevuyu Oluştur
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL 3: TAHSİLAT EKLE -->
  <div id="paymentModal" class="fixed inset-0 z-50 hidden bg-black/50 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
      <div class="flex items-center justify-between border-b border-neutral-100 pb-3 mb-4">
        <h3 class="font-serif text-xl font-bold text-charcoal">Ödeme / Tahsilat Al</h3>
        <button onclick="closeModal('paymentModal')" class="p-1.5 rounded-full bg-cream text-taupe hover:text-charcoal">✕</button>
      </div>
      <p id="payModalCustomerName" class="text-sm font-semibold text-rosegoldDark mb-1"></p>
      <p id="payModalRemainingText" class="text-xs text-taupe mb-4"></p>

      <form id="paymentForm" class="space-y-3">
        <input type="hidden" id="payCustomerId">
        <div>
          <label class="block text-xs font-semibold text-taupe mb-1">Tahsil Edilen Tutar (₺)</label>
          <input type="number" id="payAmountInput" min="1" required placeholder="Örn: 1000" class="w-full bg-cream border border-rosegold/30 rounded-xl px-3.5 py-2.5 text-base font-bold text-charcoal focus:outline-none focus:border-rosegold">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl shadow-sm transition">
          Tahsilatı Onayla
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Bildirim Alanı -->
  <div id="toastBox" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden bg-charcoal text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg"></div>

  <!-- Firebase Modüler SDK (Cloud Firestore) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      updateDoc,
      deleteDoc,
      doc,
      onSnapshot,
      query,
      orderBy,
      increment
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAivHcOQ4t950_u2dfDowQnWuVLGnIsxBM",
      authDomain: "lazer-97e1d.firebaseapp.com",
      projectId: "lazer-97e1d",
      storageBucket: "lazer-97e1d.firebasestorage.app",
      messagingSenderId: "318067934891",
      appId: "1:318067934891:web:b11777e7376c2e54c019ee"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let customers = [];
    let appointments = [];

    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('filterDate').value = todayStr;
    document.getElementById('apptDate').value = todayStr;

    function setConnectionStatus(connected, text) {
      const badge = document.getElementById('dbStatusBadge');
      const dot = document.getElementById('dbStatusDot');
      const label = document.getElementById('dbStatusText');
      if (connected) {
        badge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200";
        dot.className = "w-2 h-2 rounded-full bg-emerald-500";
        label.textContent = text || "Bulut Bağlı";
      } else {
        badge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-red-50 text-red-700 border border-red-200";
        dot.className = "w-2 h-2 rounded-full bg-red-500";
        label.textContent = text || "Bağlantı Hatası";
      }
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      box.textContent = msg;
      box.classList.remove('hidden');
      setTimeout(() => box.classList.add('hidden'), 2800);
    }

    // Müşterileri Canlı Dinle
    const customersQuery = query(collection(db, "customers"), orderBy("createdAt", "desc"));
    onSnapshot(customersQuery, (snapshot) => {
      setConnectionStatus(true, "Bulut Bağlı");
      customers = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      updateCustomerDropdown();
      renderCustomers();
      updateStats();
    }, (error) => {
      console.error("Müşteri okuma hatası:", error);
      setConnectionStatus(false, "Yetki / Ağ Hatası");
    });

    // Randevuları Canlı Dinle
    const appointmentsQuery = query(collection(db, "appointments"), orderBy("date", "asc"));
    onSnapshot(appointmentsQuery, (snapshot) => {
      setConnectionStatus(true, "Bulut Bağlı");
      appointments = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAppointments();
      updateStats();
    }, (error) => {
      console.error("Randevu okuma hatası:", error);
      setConnectionStatus(false, "Yetki / Ağ Hatası");
    });

    // İstatistikleri Güncelle
    function updateStats() {
      const todayAppts = appointments.filter(a => a.date === todayStr && a.status !== 'cancelled');
      document.getElementById('statTodayCount').textContent = todayAppts.length;
      document.getElementById('statCustomerCount').textContent = customers.length;

      let totalPaid = 0;
      let totalRemaining = 0;
      customers.forEach(c => {
        const price = Number(c.totalPrice) || 0;
        const paid = Number(c.paidAmount) || 0;
        totalPaid += paid;
        totalRemaining += Math.max(0, price - paid);
      });

      document.getElementById('statTotalPaid').textContent = `₺${totalPaid.toLocaleString('tr-TR')}`;
      document.getElementById('statTotalRemaining').textContent = `₺${totalRemaining.toLocaleString('tr-TR')}`;
    }

    // Müşteri Seçim Kutusunu Doldur
    function updateCustomerDropdown() {
      const select = document.getElementById('apptCustomerSelect');
      const currentVal = select.value;
      select.innerHTML = '<option value="">-- Kayıtlı Müşteri Seçin --</option>';
      customers.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = `${c.name} (${c.phone}) — [${c.completedSessions || 0}/${c.totalSessions || 8} Seans]`;
        select.appendChild(opt);
      });
      if (currentVal) select.value = currentVal;
    }

    // Yeni Müşteri Ekle
    document.getElementById('customerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, "customers"), {
          name: document.getElementById('custName').value.trim(),
          phone: document.getElementById('custPhone').value.trim(),
          skinType: document.getElementById('custSkinType').value,
          packageName: document.getElementById('custPackage').value.trim(),
          totalSessions: Number(document.getElementById('custTotalSessions').value) || 8,
          completedSessions: 0,
          totalPrice: Number(document.getElementById('custTotalPrice').value) || 0,
          paidAmount: Number(document.getElementById('custPaidAmount').value) || 0,
          notes: document.getElementById('custNotes').value.trim(),
          createdAt: Date.now()
        });
        e.target.reset();
        closeModal('customerModal');
        showToast("Müşteri başarıyla kaydedildi.");
      } catch (err) {
        alert("Kayıt hatası: " + err.message);
      }
    });

    // Yeni Randevu Ekle
    document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const customerId = document.getElementById('apptCustomerSelect').value;
      const customer = customers.find(c => c.id === customerId);
      if (!customer) return alert("Lütfen geçerli bir müşteri seçin.");

      try {
        await addDoc(collection(db, "appointments"), {
          customerId: customer.id,
          customerName: customer.name,
          customerPhone: customer.phone,
          date: document.getElementById('apptDate').value,
          time: document.getElementById('apptTime').value,
          area: document.getElementById('apptArea').value.trim(),
          note: document.getElementById('apptNote').value.trim(),
          status: 'scheduled',
          createdAt: Date.now()
        });
        e.target.reset();
        document.getElementById('apptDate').value = todayStr;
        closeModal('appointmentModal');
        showToast("Randevu takvime eklendi.");
      } catch (err) {
        alert("Randevu ekleme hatası: " + err.message);
      }
    });

    // Tahsilat Kaydet
    document.getElementById('paymentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('payCustomerId').value;
      const amount = Number(document.getElementById('payAmountInput').value);
      if (!id || amount <= 0) return;

      try {
        await updateDoc(doc(db, "customers", id), {
          paidAmount: increment(amount)
        });
        closeModal('paymentModal');
        showToast(`₺${amount.toLocaleString('tr-TR')} tahsilat eklendi.`);
      } catch (err) {
        alert("Ödeme güncellenemedi: " + err.message);
      }
    });

    // Randevuları Listele
    window.renderAppointments = function() {
      const container = document.getElementById('appointmentsList');
      const selectedDate = document.getElementById('filterDate').value;

      let filtered = [...appointments];
      if (selectedDate) {
        filtered = filtered.filter(a => a.date === selectedDate);
      }
      filtered.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-dashed border-rosegold/40">
            <p class="text-sm font-medium text-taupe">Seçili tarihte planlanmış lazer randevusu bulunmuyor.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(a => {
        const isDone = a.status === 'completed';
        const cleanPhone = (a.customerPhone || '').replace(/\D/g, '');
        const waPhone = cleanPhone.startsWith('0') ? '9' + cleanPhone : (cleanPhone.startsWith('90') ? cleanPhone : '90' + cleanPhone);
        const waText = encodeURIComponent(`Merhaba ${a.customerName}, Salon Hidayet Hair & Makeup Studio'daki ${a.date} saat ${a.time} lazer randevunuzu hatırlatmak isteriz.`);

        return `
          <div class="glass-card rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${isDone ? 'opacity-75 bg-emerald-50/40' : ''}">
            <div class="flex items-start gap-3.5">
              <div class="bg-blush text-rosegoldDark font-bold rounded-xl px-3 py-2 text-center min-w-[74px]">
                <span class="block text-sm">${a.time}</span>
                <span class="block text-[10px] font-medium text-taupe">${a.date}</span>
              </div>
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h3 class="font-bold text-charcoal text-base">${a.customerName}</h3>
                  ${isDone
                    ? '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Tamamlandı ✓</span>'
                    : '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">Bekliyor</span>'
                  }
                </div>
                <p class="text-xs font-medium text-rosegoldDark mt-0.5">${a.area}</p>
                ${a.note ? `<p class="text-xs text-taupe mt-1">Not: ${a.note}</p>` : ''}
              </div>
            </div>

            <div class="flex items-center gap-2 self-end sm:self-center">
              <a href="https://wa.me/${waPhone}?text=${waText}" target="_blank" class="px-3 py-2 rounded-xl bg-emerald-50 text-emerald-700 hover:bg-emerald-100 text-xs font-semibold transition">
                WhatsApp
              </a>
              ${!isDone ? `
                <button onclick="completeAppointment('${a.id}', '${a.customerId}')" class="px-3 py-2 rounded-xl bg-charcoal text-white hover:bg-neutral-800 text-xs font-semibold transition">
                  Seansı Tamamla
                </button>
              ` : ''}
              <button onclick="deleteAppointment('${a.id}')" class="p-2 rounded-xl text-taupe hover:text-red-600 hover:bg-red-50 transition" title="Sil">
                🗑
              </button>
            </div>
          </div>
        `;
      }).join('');
    };

    // Müşterileri Listele
    window.renderCustomers = function() {
      const container = document.getElementById('customersList');
      const q = document.getElementById('customerSearchInput').value.toLowerCase().trim();

      const filtered = customers.filter(c =>
        (c.name || '').toLowerCase().includes(q) ||
        (c.phone || '').toLowerCase().includes(q) ||
        (c.packageName || '').toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white rounded-2xl p-8 text-center border border-dashed border-rosegold/40">
            <p class="text-sm font-medium text-taupe">Kayıtlı müşteri bulunamadı.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(c => {
        const total = Number(c.totalSessions) || 8;
        const done = Number(c.completedSessions) || 0;
        const percent = Math.min(100, Math.round((done / total) * 100));
        const price = Number(c.totalPrice) || 0;
        const paid = Number(c.paidAmount) || 0;
        const remaining = Math.max(0, price - paid);

        return `
          <div class="glass-card rounded-2xl p-4 shadow-sm flex flex-col justify-between space-y-3">
            <div>
              <div class="flex items-start justify-between gap-2">
                <div>
                  <h3 class="font-bold text-charcoal text-base">${c.name}</h3>
                  <p class="text-xs text-taupe">${c.phone} • <span class="text-rosegoldDark font-medium">${c.skinType || ''}</span></p>
                </div>
                <button onclick="deleteCustomer('${c.id}')" class="text-xs text-taupe hover:text-red-600 px-2 py-1 rounded-lg">Sil</button>
              </div>

              <div class="mt-2.5 bg-cream rounded-xl p-2.5 border border-rosegold/15">
                <div class="flex justify-between text-xs font-semibold mb-1">
                  <span class="text-charcoal">${c.packageName}</span>
                  <span class="text-rosegoldDark">${done} / ${total} Seans</span>
                </div>
                <div class="w-full h-2 bg-blush rounded-full overflow-hidden">
                  <div class="h-full bg-rosegold rounded-full transition-all" style="width: ${percent}%"></div>
                </div>
              </div>

              ${c.notes ? `<p class="text-xs text-taupe mt-2 italic">"${c.notes}"</p>` : ''}
            </div>

            <div class="pt-2 border-t border-neutral-100 flex items-center justify-between gap-2">
              <div class="text-xs">
                <span class="text-taupe block">Kalan Bakiye:</span>
                <span class="font-bold ${remaining > 0 ? 'text-rosegoldDark' : 'text-emerald-700'} text-sm">
                  ${remaining > 0 ? '₺' + remaining.toLocaleString('tr-TR') : 'Ödendi ✓'}
                </span>
              </div>

              <div class="flex items-center gap-1.5">
                <button onclick="manualSessionStep('${c.id}', 1)" class="px-2.5 py-1.5 rounded-xl bg-blush text-rosegoldDark hover:bg-rosegold/20 text-xs font-semibold transition">
                  +1 Seans
                </button>
                <button onclick="openPaymentModal('${c.id}', '${c.name.replace(/'/g, "\\'")}', ${remaining})" class="px-3 py-1.5 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 text-xs font-semibold transition">
                  Tahsilat
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    };

    // Global Fonksiyonlar (HTML onclick erişimi için)
    window.completeAppointment = async function(apptId, customerId) {
      try {
        await updateDoc(doc(db, "appointments", apptId), { status: 'completed' });
        if (customerId) {
          await updateDoc(doc(db, "customers", customerId), {
            completedSessions: increment(1)
          });
        }
        showToast("Seans tamamlandı ve müşteri paketine işlendi.");
      } catch (err) {
        alert("İşlem hatası: " + err.message);
      }
    };

    window.manualSessionStep = async function(customerId, delta) {
      try {
        await updateDoc(doc(db, "customers", customerId), {
          completedSessions: increment(delta)
        });
        showToast("Seans sayısı güncellendi.");
      } catch (err) {
        alert("Hata: " + err.message);
      }
    };

    window.deleteAppointment = async function(id) {
      if (!confirm("Bu randevuyu silmek istediğinize emin misiniz?")) return;
      await deleteDoc(doc(db, "appointments", id));
      showToast("Randevu silindi.");
    };

    window.deleteCustomer = async function(id) {
      if (!confirm("Bu müşteriyi ve paket bilgilerini silmek istediğinize emin misiniz?")) return;
      await deleteDoc(doc(db, "customers", id));
      showToast("Müşteri silindi.");
    };

    window.autoFillAreaFromCustomer = function() {
      const id = document.getElementById('apptCustomerSelect').value;
      const c = customers.find(x => x.id === id);
      if (c) {
        const nextSession = (Number(c.completedSessions) || 0) + 1;
        document.getElementById('apptArea').value = `${c.packageName} - ${nextSession}. Seans`;
      }
    };

    window.openPaymentModal = function(id, name, remaining) {
      document.getElementById('payCustomerId').value = id;
      document.getElementById('payModalCustomerName').textContent = name;
      document.getElementById('payModalRemainingText').textContent = `Mevcut Kalan Bakiye: ₺${remaining.toLocaleString('tr-TR')}`;
      document.getElementById('payAmountInput').value = remaining > 0 ? remaining : '';
      openModal('paymentModal');
    };

    window.switchTab = function(tab) {
      const apptSec = document.getElementById('appointmentsSection');
      const custSec = document.getElementById('customersSection');
      const apptBtn = document.getElementById('tabAppointmentsBtn');
      const custBtn = document.getElementById('tabCustomersBtn');

      if (tab === 'appointments') {
        apptSec.classList.remove('hidden');
        custSec.classList.add('hidden');
        apptBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-xl bg-white text-charcoal shadow-sm transition";
        custBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-xl text-taupe hover:text-charcoal transition";
      } else {
        custSec.classList.remove('hidden');
        apptSec.classList.add('hidden');
        custBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-xl bg-white text-charcoal shadow-sm transition";
        apptBtn.className = "flex-1 py-2.5 text-sm font-semibold rounded-xl text-taupe hover:text-charcoal transition";
      }
    };

    window.setTodayFilter = function() {
      document.getElementById('filterDate').value = todayStr;
      renderAppointments();
    };

    window.clearDateFilter = function() {
      document.getElementById('filterDate').value = '';
      renderAppointments();
    };

    document.getElementById('filterDate').addEventListener('change', renderAppointments);

    window.openModal = function(id) {
      document.getElementById(id).classList.remove('hidden');
    };

    window.closeModal = function(id) {
      document.getElementById(id).classList.add('hidden');
    };
  </script>
</body>
</html>
